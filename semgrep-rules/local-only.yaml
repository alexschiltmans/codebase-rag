rules:
  # The app is meant to answer questions about a codebase without any of it leaving the machine.
  # Ingestion, retrieval, and the vector store are where that promise is kept or broken: everything
  # they touch is repository content. HTTP clients are allowed in `llm/` (the Ollama and
  # OpenAI-compatible clients are the deliberate egress point) and nowhere else in those layers.
  # A type checker cannot see this: `requests.post` in a chunker is perfectly well-typed.
  - id: no-network-in-indexing-path
    languages: [python]
    severity: ERROR
    message: >-
      Network client used in the indexing, retrieval, or storage path. These layers handle
      repository content and must stay local; route outbound calls through codebase_rag.llm
      instead, which is the one layer allowed to leave the machine.
    paths:
      include:
        - src/codebase_rag/data_ingestion/
        - src/codebase_rag/retrieval/
        - src/codebase_rag/database/
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(...)
          - pattern: httpx.$METHOD(...)
          - pattern: urllib.request.$METHOD(...)
          - pattern: http.client.$CLS(...)
          - pattern: socket.socket(...)
          - pattern: aiohttp.$ANY(...)

  # The Qdrant host and port, the collection name, and the local index directory all belong to
  # Config, which reads them from the environment. A literal that duplicates one of them creates a
  # second source of truth that silently ignores the environment, and the failure mode is quiet:
  # the process reads an empty index from a directory nobody configured and answers from nothing.
  - id: no-hardcoded-index-path
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded index or service location. Resolve it from Config (cache_dir, repo_local_path,
      qdrant_host, qdrant_port, collection_name) so the environment stays in control of where the
      index lives.
    paths:
      include:
        - src/codebase_rag/
      exclude:
        - src/codebase_rag/config.py
    patterns:
      - pattern-either:
          - pattern: |
              "=~/^\\.?\\/?data\\/(cache|repos)/"
          - pattern: Path("=~/^\\.?\\/?data\\//")

  # Every path this process deserialises has to be one it wrote itself, under the configured index
  # directory. `pickle.load` runs arbitrary code from its input, so a second call site reading from
  # anywhere else turns a downloaded or user-supplied file into code execution. The document cache
  # is the single sanctioned case, and it is confined to one function so that the set of readable
  # paths stays reviewable.
  - id: no-pickle-load-outside-document-cache
    languages: [python]
    severity: ERROR
    message: >-
      pickle deserialisation outside load_documents_cache. pickle.load executes arbitrary code from
      its input; the document cache under Config.cache_dir is the only sanctioned source. Use JSON
      for anything else.
    paths:
      include:
        - src/codebase_rag/
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
      - pattern-not-inside: |
          def load_documents_cache(...):
            ...

  # Same reasoning as pickle, and worth its own rule because there is no sanctioned call site at
  # all: `torch.load` on a checkpoint is pickle deserialisation wearing a different name, and this
  # project only ever loads models through sentence-transformers by name.
  - id: no-torch-load
    languages: [python]
    severity: ERROR
    message: >-
      torch.load deserialises pickled data and executes code from it. Models here load through
      SentenceTransformer by name; there is no reason to read a checkpoint file directly.
    paths:
      include:
        - src/codebase_rag/
        - evals/
        - scripts/
    patterns:
      - pattern-either:
          - pattern: torch.load(...)
          - pattern: joblib.load(...)

  # A model name without a revision resolves to whatever the hub's default branch points at today.
  # Two runs weeks apart then embed with different weights under the same label, which moves every
  # published retrieval number without anything in the diff to explain it, and invalidates a
  # collection built with the earlier weights while the model-name binding check still passes.
  - id: embedding-model-needs-pinned-revision
    languages: [python]
    severity: ERROR
    message: >-
      Embedding or reranker model loaded without a pinned revision. Pass revision=<commit sha> so
      the weights behind a model name cannot change between runs and quietly move retrieval scores.
    paths:
      include:
        - src/codebase_rag/
        - evals/
    patterns:
      - pattern-either:
          - pattern: SentenceTransformer(...)
          - pattern: CrossEncoder(...)
          - pattern: $CLS.from_pretrained(...)
      - pattern-not: SentenceTransformer(..., revision=..., ...)
      - pattern-not: CrossEncoder(..., revision=..., ...)
      - pattern-not: $CLS.from_pretrained(..., revision=..., ...)

  # The collection is created with cosine distance and the encoder normalises, so scores are
  # comparable and the fusion weights in hybrid search were tuned against that. Creating a
  # collection under a different metric does not fail: it returns plausible-looking scores on a
  # different scale, and the ranking degrades rather than erroring.
  - id: vector-store-assumes-cosine
    languages: [python]
    severity: ERROR
    message: >-
      Qdrant collection created with a distance other than COSINE. Embeddings here are L2
      normalised and the retrieval scores and fusion weights assume cosine; another metric returns
      plausible numbers on a different scale rather than failing.
    paths:
      include:
        - src/codebase_rag/
    patterns:
      - pattern: VectorParams(..., distance=$D, ...)
      - pattern-not: VectorParams(..., distance=Distance.COSINE, ...)

  # Cosine over unnormalised vectors is dominated by magnitude rather than direction, so long
  # chunks outrank relevant ones. Nothing raises; the results just get worse. The encoder is the
  # only place normalisation can be established, so it is required at every encode call.
  - id: embeddings-must-be-normalised
    languages: [python]
    severity: ERROR
    message: >-
      Encoding without normalize_embeddings=True. The store compares with cosine, which over
      unnormalised vectors ranks by magnitude and silently degrades retrieval instead of failing.
    paths:
      include:
        - src/codebase_rag/database/
    patterns:
      - pattern: $MODEL.encode(...)
      - pattern-not: $MODEL.encode(..., normalize_embeddings=True, ...)

  # Ingestion walks a cloned repository and runs git against it. A shell string built from any of
  # that content is injectable by the repository being indexed, which is untrusted input by
  # definition here: the whole point is to point this at code somebody else wrote.
  - id: no-shell-in-repo-handling
    languages: [python]
    severity: ERROR
    message: >-
      Shell invocation in a path that handles cloned repository content. Repository contents are
      untrusted input; pass an argument list instead of a shell string.
    paths:
      include:
        - src/codebase_rag/
        - scripts/
    patterns:
      - pattern-either:
          - pattern: subprocess.$FN(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)

  # TLS verification off in a project whose stated position is that data stays local is a
  # contradiction worth failing on rather than explaining in a comment.
  - id: no-disabled-tls-verification
    languages: [python]
    severity: ERROR
    message: TLS verification disabled. Fix the certificate chain rather than turning the check off.
    paths:
      include:
        - src/codebase_rag/
        - evals/
        - scripts/
    patterns:
      - pattern-either:
          - pattern: requests.$FN(..., verify=False, ...)
          - pattern: httpx.$CLS(..., verify=False, ...)
          - pattern: ssl._create_unverified_context(...)
