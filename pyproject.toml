[project]
name = "codebase-rag"
version = "0.1.1"
description = "LLM-RAG application for exploring and understanding codebases"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Alex Schiltmans" },
]
dependencies = [
    "langchain>=1.3.3,<2",
    "langchain-core>=1.3.3,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-ollama>=1.0.1,<2",
    "langchain-text-splitters>=1.1.1,<2",
    "streamlit>=1.48.0,<2",
    "qdrant-client>=1.7.0,<2",
    "gitpython>=3.1.55,<4",
    "sentence-transformers>=5.2.3,<6",
    "rank-bm25>=0.2.2,<1",
    "python-dotenv>=1.0.0,<2",
    "requests>=2.34.2,<3",
    "langfuse>=2.0.0,<3",
    "ragas>=0.4.3,<1",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]

[project.scripts]
codebase-rag = "codebase_rag.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-randomly>=4.1,<5",
    "pytest-asyncio>=1.0,<2",
    "types-requests>=2.33",
    "pre-commit>=4.6",
    "pip-audit>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
# tests/fixtures/ holds frozen measurement inputs, not source. Formatting them would re-cut their
# chunk boundaries and move the retrieval gate's recorded numbers, so the formatter must not touch
# them and the linter has no business judging them.
extend-exclude = ["data/", "tests/fixtures/"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "B", "I", "N", "UP", "ANN", "S", "BLE", "FBT", "A", "C4", "ICN", "PIE",
    "T20", "PT", "RET", "SIM",
    # Added once the families above were clean. Each of these was measured against the tree
    # before being switched on, so none of them is carrying a suppression list.
    "ASYNC",  # blocking calls inside async defs, which is why the HTTP surface matters here
    "LOG",    # logging misuse the G rules do not cover
    "G",      # %s-style logging args rather than f-strings, so records stay lazily formatted
    "DTZ",    # naive datetimes
    "ERA",    # commented-out code
    "EXE",    # shebang and executable-bit mismatches
    "FA",     # missing __future__ annotations where a runtime annotation would break
    "FLY",    # static str.join over a literal sequence
    "FURB",   # modernisations ruff can prove safe
    "INT",    # gettext misuse
    "ISC",    # implicit string concatenation
    "PERF",   # loop patterns with a direct builtin equivalent
    "PYI",    # stub and special-method typing conventions
    "Q",      # quote style, matching the formatter
    "RSE",    # raise with unnecessary parentheses
    "RUF",    # ruff's own rules, including stale-noqa detection
    "SLOT",   # __slots__ on subclasses of immutable builtins
    "T10",    # leftover debugger calls
    "YTT",    # sys.version comparisons
]
ignore = [
    "ANN401",   # Dynamically typed expressions (typing.Any) disallowed — unavoidable for **kwargs and duck-typed APIs
    "BLE001",   # Blind exception catches — intentional at infrastructure boundaries (Qdrant, git, subprocess)
    "FBT001",   # Boolean-typed positional argument — these are keyword-only defaults
    "FBT002",   # Boolean default positional argument — these are keyword-only defaults
    "ISC001",   # Single-line implicit concatenation: the formatter owns this and ruff warns on the overlap
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is expected in tests
    "ANN",    # type annotations not required
    "S108",   # /tmp paths in mock configs are not a security risk
    "S301",   # pickle in test fixtures is safe
    "S311",   # pseudo-random is fine for test data generation
    "S603",   # subprocess calls are safe in tests
    "PT017",  # @patch params misidentified as fixtures
    "PT019",  # @patch params misidentified as fixtures
    "FBT003", # boolean positional in patch.object calls
    "RUF059", # unpacking a full return tuple documents its shape even where only part is asserted on
]
"evals/**" = [
    "T201",   # print is expected in CLI evaluation scripts
    "ANN",    # type annotations not required
]
"scripts/check_tracked_imports.py" = [
    "T201",   # print is expected in a make-verify diagnostic script
]
"scripts/merge_sarif.py" = [
    "T201",   # print is this script's output; it reports what it merged to the terminal
]
"src/codebase_rag/cli.py" = [
    "T201",   # print is expected in CLI scripts
]
"src/codebase_rag/api/routers/**" = [
    "B008",   # FastAPI's Depends() idiom requires calling it in argument defaults
]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
# The vector store, Streamlit, and the ragas/langchain stack ship no usable stubs, so their
# imports resolve to Any. Without this every module that touches them fails to import at all,
# which is a worse trade than the Any that strict mode otherwise objects to.
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
# Frozen fixture corpus, not code this project ships. See the ruff exclusion above.
exclude = "^tests/fixtures/"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Strict rather than auto: an async test only runs under a loop when it says so with the marker.
# Under auto, a coroutine test that loses its marker in a refactor still gets collected and still
# passes, so the mode that looks more convenient is the one that can hide a test that stopped
# running. The loop is per-test, which is what keeps a client bound to one test's loop from being
# reused by the next.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs live Qdrant (make services-start)",
    "e2e: end-to-end flow, needs live services",
    "performance: timing and scaling checks, runs offline",
    "evaluation: retrieval/response quality checks, runs offline",
]
